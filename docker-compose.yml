version: "3.8"

services:
  cloudbite-cafe:
    build:
      context: .
      args:
        BUILD_NUMBER: "1"
        GIT_COMMIT: "desktop-local"
        GIT_BRANCH: "main"
        CLOUD_PROVIDER: "Docker Desktop (Windows)"
        AWS_REGION: "localhost"
    container_name: cloudbite-cafe-app
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - ./data:/app/data
