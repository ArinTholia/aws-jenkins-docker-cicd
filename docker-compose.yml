version: "3.8"

services:
  cloudpulse-app:
    build:
      context: .
      args:
        BUILD_NUMBER: "${BUILD_NUMBER:-1}"
        GIT_COMMIT: "${GIT_COMMIT:-main-docker}"
        GIT_BRANCH: "main"
        CLOUD_PROVIDER: "AWS EC2 (Docker Compose)"
        AWS_REGION: "ap-south-1"
    container_name: cloudpulse-app
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - ./data:/app/data
