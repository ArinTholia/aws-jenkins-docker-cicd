<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — CloudBite Cafe</title>
  <style>
    :root {
      --primary: #ff5a1f;
      --primary-hover: #e04812;
      --primary-soft: #fff0eb;
      --bg-page: #fbf9f6;
      --bg-card: #ffffff;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --danger: #ef4444;
      --danger-soft: #fee2e2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      border: 1px solid #f1e4d8;
      border-radius: var(--radius-lg);
      padding: 2.5rem 2rem;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.05);
    }

    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 1.75rem;
    }

    .brand-icon {
      font-size: 2.2rem;
      background: var(--primary-soft);
      width: 56px;
      height: 56px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.75rem;
    }

    .brand-header h1 {
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--text-dark);
    }

    .brand-header p {
      font-size: 0.84rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    .alert {
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
      display: none;
    }

    .alert-danger {
      background: var(--danger-soft);
      color: var(--danger);
      border: 1px solid #fca5a5;
    }

    .form-group {
      margin-bottom: 1.1rem;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 0.35rem;
    }

    .form-input {
      width: 100%;
      padding: 0.75rem 0.95rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.15s;
    }

    .form-input:focus {
      border-color: var(--primary);
    }

    .btn-submit {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.85rem;
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.15s;
    }

    .btn-submit:hover {
      background: var(--primary-hover);
    }

    .demo-box {
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px dashed var(--border);
    }

    .demo-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      font-weight: 700;
      text-align: center;
      margin-bottom: 0.75rem;
    }

    .demo-pills {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }

    .demo-pill {
      background: #f8fafc;
      border: 1px solid var(--border);
      padding: 0.6rem 0.5rem;
      border-radius: var(--radius-sm);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }

    .demo-pill:hover {
      background: #f1f5f9;
      border-color: var(--primary);
      color: var(--primary);
    }

    .demo-pill span {
      display: block;
      font-size: 0.68rem;
      color: var(--text-muted);
      font-weight: 400;
      margin-top: 0.15rem;
    }

    .switch-auth {
      text-align: center;
      margin-top: 1.4rem;
      font-size: 0.84rem;
      color: var(--text-muted);
    }

    .switch-auth a {
      color: var(--primary);
      font-weight: 700;
      text-decoration: none;
    }

    .switch-auth a:hover {
      text-decoration: underline;
    }

    .back-home {
      text-align: center;
      margin-top: 1.25rem;
    }

    .back-home a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="brand-header">
      <div class="brand-icon">🍔</div>
      <h1>CloudBite Cafe</h1>
      <p>Sign in to your account</p>
    </div>

    <!-- Info Alert Box -->
    <div class="alert" id="infoAlert" style="background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;display:none;margin-bottom:1.25rem;padding:0.75rem 1rem;border-radius:var(--radius-sm);font-size:0.84rem;font-weight:600">
      🔒 Please sign in or register to place your food order.
    </div>

    <!-- Error Alert Box -->
    <div class="alert alert-danger" id="errorAlert"></div>

    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="emailInput" class="form-input" placeholder="e.g. customer@gmail.com" required />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="passwordInput" class="form-input" placeholder="••••••••" required />
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">Sign In</button>
    </form>

    <div class="switch-auth">
      Don't have an account? <a href="/register">Create an account</a>
    </div>

    <!-- Quick Demo Credential Autofill -->
    <div class="demo-box">
      <div class="demo-title">Quick Demo Login Accounts</div>
      <div class="demo-pills">
        <div class="demo-pill" onclick="fillCredentials('manager@cloudbite.cafe', 'manager123')">
          👨‍🍳 Staff / Manager
          <span>manager@cloudbite.cafe</span>
        </div>
        <div class="demo-pill" onclick="fillCredentials('customer@gmail.com', 'customer123')">
          👤 Customer
          <span>customer@gmail.com</span>
        </div>
      </div>
    </div>

    <div class="back-home">
      <a href="/">← Return to Cafe Menu</a>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('msg') === 'order') {
      document.getElementById('infoAlert').style.display = 'block';
    }

    function fillCredentials(email, password) {
      document.getElementById('emailInput').value = email;
      document.getElementById('passwordInput').value = password;
      document.getElementById('errorAlert').style.display = 'none';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      const alertBox = document.getElementById('errorAlert');
      const submitBtn = document.getElementById('submitBtn');

      alertBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying credentials...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (!res.ok || !data.success) {
          alertBox.textContent = data.error || 'Invalid email or password';
          alertBox.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In';
          return;
        }

        // Store real authenticated session in localStorage
        localStorage.setItem('cloudbite_user', JSON.stringify(data.user));

        // Redirect based on role!
        if (data.user.role === 'Manager') {
          window.location.href = '/dashboard';
        } else {
          window.location.href = '/';
        }
      } catch (err) {
        alertBox.textContent = 'Network error connecting to auth server';
        alertBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    }
  </script>

</body>
</html>
